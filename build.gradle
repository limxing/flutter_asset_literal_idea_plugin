plugins {
    id 'org.jetbrains.intellij.platform' version '2.18.1'
}

Properties properties = new Properties()
properties.load(new FileReader(project.rootProject.file('local.properties')))

group 'com.ixigua'
version '2.0.0'

java {
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
        marketplace()
    }
}

dependencies {
    intellijPlatform {
        // 使用本机已安装的 Android Studio 作为编译目标（精确匹配 AI-253 平台）
        local(properties.getProperty('ideDirectory'))
        bundledPlugin('com.intellij.modules.lang')
        // Dart 插件不在 AS bundled 目录，从 Marketplace 拉取与本地一致版本
        plugin('Dart', '505.0.0')
    }

    // SVG 预览功能需要的 Batik 库（原 1.x 插件由 IDE 间接提供，2.x 需显式声明）
    // 只排除 xml-apis（其旧版 org.w3c.dom 与 JDK21 内置 java.xml 冲突，导致
    // SAXSVGDocumentFactory 初始化失败）；必须保留 xml-apis-ext（提供 org.w3c.dom.svg，
    // JDK 内置 java.xml 不含此包）
    implementation('org.apache.xmlgraphics:batik-transcoder:1.17') {
        exclude group: 'xml-apis', module: 'xml-apis'
    }
    implementation('org.apache.xmlgraphics:batik-codec:1.17') {
        exclude group: 'xml-apis', module: 'xml-apis'
    }
    implementation('org.apache.xmlgraphics:batik-anim:1.17') {
        exclude group: 'xml-apis', module: 'xml-apis'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

test {
    useJUnitPlatform()
}

intellijPlatform {
    pluginConfiguration {
        version = project.version
        changeNotes = """
        <h1>2.0.0</h1>
        <ul>
          <li> Rebuilt for Android Studio 2025.3 (AI-253) </li>
          <li> Upgrade to IntelliJ Platform Gradle Plugin 2.x </li>
          <li> Compatible with Dart plugin 505.0.0 </li>
        </ul>
        """
    }
}
